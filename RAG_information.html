<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Chatbot · College & Hospital Info</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #eef2f7 0%, #d9e2ec 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .chat-container {
      max-width: 1000px;
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 2.8rem;
      box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.7);
      padding: 1.8rem 2rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.2s;
    }

    /* header */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 0.8rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .brand i {
      font-size: 2.2rem;
      color: #153e5a;
      background: rgba(21, 62, 90, 0.08);
      padding: 0.6rem 0.7rem;
      border-radius: 20px;
    }

    .brand h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #153e5a, #2b738b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-badge {
      background: #d4e3ef;
      padding: 0.4rem 1.4rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #153e5a;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 1px 4px rgba(255,255,255,0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .status-badge i {
      font-size: 0.6rem;
      color: #2b9b7a;
    }

    /* knowledge base selector */
    .kb-selector {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }

    .kb-btn {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid #b8cfdb;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1c4d62;
      cursor: pointer;
      transition: all 0.15s;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kb-btn i {
      color: #3d7a8f;
    }

    .kb-btn.active {
      background: #1a4b5e;
      color: white;
      border-color: #3a7b8f;
      box-shadow: 0 4px 12px rgba(20, 70, 90, 0.25);
    }

    .kb-btn.active i {
      color: #b6dceb;
    }

    .kb-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.7);
    }

    /* chat area */
    .chat-box {
      background: #142f3d;
      border-radius: 2rem;
      padding: 1.5rem 1.5rem 0.8rem;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.3), 0 12px 28px -12px rgba(0, 20, 30, 0.5);
      border: 1px solid #3b6b7a;
      display: flex;
      flex-direction: column;
      min-height: 380px;
    }

    .messages {
      flex: 1;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 0.4rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .messages::-webkit-scrollbar {
      width: 5px;
    }
    .messages::-webkit-scrollbar-track {
      background: #1f4453;
      border-radius: 10px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: #4f8396;
      border-radius: 10px;
    }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: fadeIn 0.25s ease;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg .avatar {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      color: white;
    }

    .msg.bot .avatar {
      background: #1d6a7a;
    }
    .msg.user .avatar {
      background: #4f7b8a;
    }

    .msg .bubble {
      background: #1f4453;
      padding: 0.7rem 1.2rem;
      border-radius: 1.6rem;
      border-top-left-radius: 0.4rem;
      color: #e3f0f7;
      font-size: 0.9rem;
      line-height: 1.5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #2d6579;
      border-radius: 1.6rem;
      border-top-right-radius: 0.4rem;
    }

    .msg .bubble .source {
      font-size: 0.65rem;
      color: #9ac2d3;
      margin-top: 6px;
      border-top: 1px solid #3f6879;
      padding-top: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg .bubble .source i {
      font-size: 0.6rem;
      color: #6fa5ba;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 0.5rem 0;
      color: #a2c8d9;
      font-size: 0.8rem;
      align-items: center;
    }

    .typing-indicator .dot {
      width: 8px;
      height: 8px;
      background: #75aec4;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* input area */
    .input-area {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      background: #1b3f4e;
      border-radius: 3rem;
      padding: 0.3rem 0.3rem 0.3rem 1.2rem;
      border: 1px solid #3d7182;
      margin-top: 0.2rem;
    }

    .input-area input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.7rem 0;
      color: #ecf6fa;
      font-size: 0.9rem;
      outline: none;
      min-width: 0;
    }

    .input-area input::placeholder {
      color: #7eaabb;
    }

    .input-area button {
      background: #28778f;
      border: none;
      color: white;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #479bb3;
      white-space: nowrap;
    }

    .input-area button i {
      color: #c3e6f2;
    }

    .input-area button:hover {
      background: #3490a8;
      transform: scale(0.97);
    }

    .input-area button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .footer-note {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #3d6779;
      margin-top: 1rem;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .footer-note i {
      margin-right: 4px;
      color: #2b6c80;
    }

    @media (max-width: 640px) {
      .chat-container { padding: 1.2rem; }
      .msg { max-width: 95%; }
      .kb-selector { justify-content: center; }
      .input-area button span { display: none; }
      .input-area button { padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>
<div class="chat-container">
  <!-- header -->
  <div class="header">
    <div class="brand">
      <i class="fas fa-robot"></i>
      <h1>RAG Assistant</h1>
    </div>
    <div class="status-badge">
      <i class="fas fa-circle" style="color:#2ecc71;"></i>
      <span>RAG · active</span>
      <span style="opacity:0.5;margin-left:4px;">v2.0</span>
    </div>
  </div>

  <!-- knowledge base toggle -->
  <div class="kb-selector" id="kbSelector">
    <button class="kb-btn active" data-kb="college"><i class="fas fa-university"></i> College</button>
    <button class="kb-btn" data-kb="hospital"><i class="fas fa-hospital"></i> Hospital</button>
    <button class="kb-btn" data-kb="both"><i class="fas fa-layer-group"></i> Both</button>
  </div>

  <!-- chat box -->
  <div class="chat-box">
    <div class="messages" id="messageContainer">
      <!-- welcome message will be injected -->
    </div>

    <!-- typing indicator (hidden by default) -->
    <div id="typingIndicator" class="typing-indicator" style="display: none;">
      <span>RAG is retrieving</span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- input -->
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask about courses, doctors, admissions, services..." autofocus>
      <button id="sendBtn"><i class="fas fa-paper-plane"></i> <span>Ask</span></button>
    </div>
  </div>

  <div class="footer-note">
    <span><i class="fas fa-database"></i> Knowledge base: College + Hospital</span>
    <span><i class="fas fa-vector-square"></i> RAG with simulated retrieval</span>
    <span><i class="fas fa-shield-alt"></i> 100+ documents</span>
  </div>
</div>

<script>
  (function() {
    // ----- RAG Knowledge base (simulated) -----
    const KB = {
      college: [
        { q: ['admission', 'apply', 'application', 'deadline', 'form'], 
          a: '📚 Admissions are open for Fall 2026. The deadline is May 15, 2026. You can apply online through the college portal. Required documents: transcripts, statement of purpose, and 2 letters of recommendation.',
          source: 'College · Admissions Office' },
        { q: ['courses', 'programs', 'major', 'minor', 'curriculum', 'bachelor', 'master'],
          a: '🎓 We offer 22 undergraduate and 14 graduate programs. Popular majors: Computer Science, Business Administration, Engineering, and Nursing. View the full course catalog on our website.',
          source: 'College · Academic Affairs' },
        { q: ['library', 'hours', 'book', 'study', 'resource'],
          a: '📖 The library is open 8:00 AM – 12:00 AM Mon-Fri, 9:00 AM – 10:00 PM Sat-Sun. You can access online journals, e-books, and study rooms. Librarians are available for research help.',
          source: 'College · Library Services' },
        { q: ['hostel', 'dormitory', 'accommodation', 'room', 'fee'],
          a: '🏠 On-campus housing includes 6 dormitories. Single and shared rooms available. Fees: $4,200 – $6,800 per semester. Apply early as spaces are limited. Meal plans are optional.',
          source: 'College · Residence Life' },
        { q: ['scholarship', 'financial aid', 'grant', 'fees', 'tuition'],
          a: '💰 Scholarships and financial aid are available based on merit and need. The average award is $12,000/year. FAFSA deadline is March 1. Visit the financial aid office for details.',
          source: 'College · Financial Aid' }
      ],
      hospital: [
        { q: ['emergency', 'er', 'urgent', 'ambulance', 'trauma'],
          a: '🚑 The Emergency Department is open 24/7. For life-threatening emergencies, call 911. Our trauma center is Level I. Average wait time is 12–18 minutes. Bring your ID and insurance card.',
          source: 'Hospital · Emergency Services' },
        { q: ['doctor', 'specialist', 'physician', 'appointment', 'consultation'],
          a: '👨‍⚕️ We have over 120 specialists across 30 departments. To book an appointment, call (555) 234-5678 or use our online portal. New patients are welcome. Referrals are recommended but not required.',
          source: 'Hospital · Medical Staff' },
        { q: ['visiting', 'hours', 'visitor', 'policy', 'family'],
          a: '🕒 Visiting hours: 10:00 AM – 8:00 PM daily. Only 2 visitors per patient at a time. Children under 12 must be accompanied. ICU visiting is restricted. Check with the front desk.',
          source: 'Hospital · Patient Services' },
        { q: ['insurance', 'billing', 'payment', 'cost', 'coverage'],
          a: '💳 We accept most major insurance plans. For billing inquiries, contact the finance office at (555) 234-5000. Payment plans are available. You can also pay online through the patient portal.',
          source: 'Hospital · Billing & Insurance' },
        { q: ['parking', 'directions', 'location', 'transport', 'map'],
          a: '📍 The hospital is located at 123 Health Blvd, Cityville. Free parking is available in lot A and B. Valet service costs $8. Bus lines 12 and 45 stop at the main entrance. View the map on our website.',
          source: 'Hospital · Facilities' }
      ]
    };

    // Merge both for "both" mode
    const bothKB = [...KB.college, ...KB.hospital];

    // DOM refs
    const messagesEl = document.getElementById('messageContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const kbBtns = document.querySelectorAll('.kb-btn');

    let currentKB = 'college'; // 'college', 'hospital', 'both'
    let isProcessing = false;

    // ----- helper: get knowledge base array -----
    function getKBArray() {
      if (currentKB === 'college') return KB.college;
      if (currentKB === 'hospital') return KB.hospital;
      return bothKB;
    }

    // ----- find best answer (simple keyword matching) -----
    function retrieveAnswer(query, kbArray) {
      const lowerQuery = query.toLowerCase();
      let bestMatch = null;
      let maxScore = 0;

      for (const entry of kbArray) {
        let score = 0;
        for (const keyword of entry.q) {
          if (lowerQuery.includes(keyword.toLowerCase())) {
            score += 1;
          }
        }
        // give extra weight if query starts with keyword
        for (const keyword of entry.q) {
          if (lowerQuery.startsWith(keyword.toLowerCase())) {
            score += 2;
          }
        }
        if (score > maxScore) {
          maxScore = score;
          bestMatch = entry;
        }
      }

      if (bestMatch && maxScore > 0) {
        return bestMatch;
      }

      // fallback
      return {
        a: "I couldn't find specific information in the knowledge base. Please try rephrasing your question or contact the administration directly.",
        source: "RAG · no match"
      };
    }

    // ----- add message to chat -----
    function addMessage(text, sender, source = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      if (sender === 'bot') {
        avatar.innerHTML = '<i class="fas fa-robot"></i>';
      } else {
        avatar.innerHTML = '<i class="fas fa-user"></i>';
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = text;

      if (source && sender === 'bot') {
        const sourceDiv = document.createElement('div');
        sourceDiv.className = 'source';
        sourceDiv.innerHTML = `<i class="fas fa-database"></i> ${source}`;
        bubble.appendChild(sourceDiv);
      }

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      messagesEl.appendChild(msgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ----- show typing indicator -----
    function setTyping(visible) {
      typingIndicator.style.display = visible ? 'flex' : 'none';
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ----- process user query -----
    function processQuery(query) {
      if (isProcessing) return;
      if (!query || query.trim() === '') return;

      // Add user message
      addMessage(query, 'user');
      userInput.value = '';
      isProcessing = true;
      sendBtn.disabled = true;
      setTyping(true);

      // Simulate RAG retrieval & generation delay
      setTimeout(() => {
        const kbArray = getKBArray();
        const result = retrieveAnswer(query, kbArray);
        const answer = result.a;
        const source = result.source || 'Knowledge base';

        // Add bot response
        addMessage(answer, 'bot', source);
        setTyping(false);
        isProcessing = false;
        sendBtn.disabled = false;
        userInput.focus();
      }, 800 + Math.random() * 700); // simulate retrieval
    }

    // ----- event listeners -----
    function handleSend() {
      const query = userInput.value.trim();
      if (query) processQuery(query);
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSend();
      }
    });

    // Knowledge base switcher
    kbBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        kbBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentKB = this.dataset.kb;
        // Add a system message about switch
        const kbName = currentKB === 'college' ? 'College' : currentKB === 'hospital' ? 'Hospital' : 'Both (College + Hospital)';
        const sysMsg = `🔄 Switched to <strong>${kbName}</strong> knowledge base.`;
        addMessage(sysMsg, 'bot', 'RAG · context updated');
        // Scroll
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    });

    // ----- welcome message -----
    function initChat() {
      const welcome = `👋 Hello! I'm the RAG assistant. I can answer questions about **College** and **Hospital** information.

      Try asking about:
      • Admissions, courses, scholarships
      • Emergency, doctors, visiting hours
      • Fees, insurance, parking

      Select a knowledge base above to focus your search.`;
      addMessage(welcome, 'bot', 'RAG · ready');
    }

    initChat();
    userInput.focus();

    // console tip
    console.log('🧠 RAG Chatbot · College & Hospital Knowledge');
    console.log('📌 Switch knowledge base using the buttons above.');
    console.log('💡 Try asking: "admission deadline" or "emergency room"');
  })();
</script>
</body>
</html>
