<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real‑Time Sign Language Recognition</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="./Real‑Time Sign Language Recognition_files/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .glass-card {
      max-width: 1000px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 3.5rem;
      padding: 2.2rem 2.5rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: 0.3s;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-weight: 600;
      font-size: 2rem;
      color: #f0f9ff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      margin-bottom: 0.3rem;
      flex-wrap: wrap;
    }

    h1 i {
      background: #4fc3f7;
      color: #0b1a2e;
      padding: 0.4rem 0.8rem;
      border-radius: 60px;
      font-size: 1.6rem;
      box-shadow: 0 4px 12px rgba(79, 195, 247, 0.3);
    }

    .subhead {
      color: #b6d0e0;
      font-weight: 400;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      border-left: 4px solid #4fc3f7;
      padding-left: 1.2rem;
      background: rgba(79, 195, 247, 0.04);
      border-radius: 0 14px 14px 0;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .subhead i {
      color: #81d4fa;
    }

    .status-pulse {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 230, 118, 0.08);
      padding: 0.2rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(0, 230, 118, 0.15);
      font-size: 0.8rem;
      color: #a5d6a7;
    }

    .status-pulse .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #00e676;
      border-radius: 50%;
      animation: pulse-dot 1.4s infinite;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.9); }
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin: 1.5rem 0 2rem 0;
    }

    @media (max-width: 700px) {
      .glass-card { padding: 1.5rem; }
      .main-grid { grid-template-columns: 1fr; gap: 1.5rem; }
    }

    /* video panel */
    .video-panel {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 2.2rem;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 8px 20px rgba(0,0,0,0.3);
    }

    .video-wrapper {
      position: relative;
      border-radius: 1.8rem;
      overflow: hidden;
      background: #0e1f2b;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #162b39;
      transform: scaleX(-1); /* mirror effect */
    }

    .video-placeholder {
      position: absolute;
      color: #819aa8;
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
    }

    .video-placeholder i {
      font-size: 3rem;
      opacity: 0.5;
      color: #4fc3f7;
    }

    .video-overlay-label {
      position: absolute;
      bottom: 1rem;
      left: 1.2rem;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #c0dae8;
      border: 1px solid rgba(255,255,255,0.05);
      letter-spacing: 0.3px;
    }

    .video-overlay-label i {
      margin-right: 6px;
      color: #4fc3f7;
    }

    /* right panel */
    .result-panel {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 2.2rem;
      padding: 1.8rem 1.5rem;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.03);
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .recognition-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 1.8rem;
      padding: 1.5rem 1.2rem;
      border-left: 5px solid #4fc3f7;
    }

    .recognition-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #8bb4cc;
      margin-bottom: 0.5rem;
    }

    .sign-display {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .sign-character {
      font-size: 4.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #81d4fa, #4fc3f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
      letter-spacing: 2px;
      min-width: 4.5rem;
      text-shadow: 0 0 20px rgba(79, 195, 247, 0.15);
    }

    .sign-word {
      font-size: 1.8rem;
      font-weight: 500;
      color: #e3f0f9;
      background: rgba(79, 195, 247, 0.06);
      padding: 0.2rem 1.2rem;
      border-radius: 60px;
      border: 1px solid rgba(79, 195, 247, 0.08);
    }

    .confidence-meter {
      margin-top: 0.2rem;
    }

    .confidence-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 20px;
      overflow: hidden;
    }

    .confidence-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4fc3f7, #81d4fa);
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .confidence-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #b0ccdd;
      margin-top: 5px;
    }

    .top-candidates {
      background: rgba(0,0,0,0.15);
      border-radius: 1.5rem;
      padding: 1.2rem 1.2rem;
    }

    .candidate-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: #cbdbe8;
      font-size: 0.95rem;
    }

    .candidate-item:last-child {
      border-bottom: none;
    }

    .candidate-letter {
      font-weight: 600;
      color: #e3f0f9;
    }

    .candidate-score {
      background: rgba(79, 195, 247, 0.08);
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-size: 0.8rem;
      color: #81d4fa;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 0.2rem;
    }

    .btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      font-weight: 500;
      color: #eef6fc;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .btn-primary {
      background: #4fc3f7;
      border: 1px solid #4fc3f7;
      color: #0b1a2e;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(79, 195, 247, 0.25);
    }

    .btn-primary i {
      color: #0b1a2e;
    }

    .btn-primary:hover {
      background: #29b6f6;
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(79, 195, 247, 0.4);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn:disabled {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(0.4);
    }

    .footnote {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #8ca9bb;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.02);
      padding-top: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      flex-wrap: wrap;
    }

    .footnote i {
      margin-right: 0.3rem;
      color: #6f96ad;
    }

    .badge {
      background: rgba(79, 195, 247, 0.08);
      padding: 0.1rem 0.8rem;
      border-radius: 60px;
      color: #81d4fa;
    }

    /* responsive tweaks */
    @media (max-width: 500px) {
      .sign-character { font-size: 3.2rem; min-width: 3rem; }
      .sign-word { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<div class="glass-card">
  <h1>
    <i class="fas fa-hands"></i> 
    <span>Sign<span style="font-weight:300;color:#b6d0e0;">·</span>Lingo</span>
  </h1>
  <div class="subhead">
    <span><i class="fas fa-video"></i> Real‑time hand sign recognition · ASL</span>
    <span class="status-pulse"><span class="dot"></span> live</span>
  </div>

  <!-- main grid -->
  <div class="main-grid">
    <!-- left: video -->
    <div class="video-panel">
      <div class="video-wrapper">
        <video id="videoFeed" autoplay="" playsinline=""></video>
        <div class="video-placeholder" id="videoPlaceholder">
          <i class="fas fa-camera"></i>
          <span>Camera starting …</span>
        </div>
        <div class="video-overlay-label">
          <i class="fas fa-arrows-alt-h"></i> mirrored view
        </div>
      </div>
    </div>

    <!-- right: recognition -->
    <div class="result-panel">
      <div class="recognition-box">
        <div class="recognition-label"><i class="fas fa-flag"></i> detected sign</div>
        <div class="sign-display">
          <span class="sign-character" id="signChar">?</span>
          <span class="sign-word" id="signWord">waiting</span>
        </div>
        <div class="confidence-meter">
          <div class="confidence-bar-bg">
            <div class="confidence-bar-fill" id="confidenceFill" style="width:0%"></div>
          </div>
          <div class="confidence-text">
            <span>confidence</span>
            <span id="confidencePercent">0%</span>
          </div>
        </div>
      </div>

      <div class="top-candidates">
        <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#7fa2b8; margin-bottom:8px; padding:0 0.2rem;">
          <span><i class="fas fa-arrow-right"></i> top hypotheses</span>
          <span>probability</span>
        </div>
        <div id="candidateList">
        <div class="candidate-item"><span class="candidate-letter">—</span> <span class="candidate-score">—</span></div>
        <div class="candidate-item"><span class="candidate-letter">—</span> <span class="candidate-score">—</span></div>
        <div class="candidate-item"><span class="candidate-letter">—</span> <span class="candidate-score">—</span></div>
      </div>
      </div>

      <div class="action-bar">
        <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> Start</button>
        <button class="btn btn-secondary" id="stopBtn" disabled=""><i class="fas fa-stop"></i> Stop</button>
        <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-sync-alt"></i> Reset</button>
      </div>
    </div>
  </div>

  <div class="footnote">
    <span><i class="fas fa-microchip"></i> simulated ML inference · 26 classes (A–Z)</span>
    <span><i class="fas fa-hand-peace"></i> ASL alphabet</span>
    <span class="badge"><i class="fas fa-rotate"></i> 30 fps</span>
  </div>
</div>

<script>
  (function() {
    // ----- DOM refs -----
    const video = document.getElementById('videoFeed');
    const placeholder = document.getElementById('videoPlaceholder');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');

    const signChar = document.getElementById('signChar');
    const signWord = document.getElementById('signWord');
    const confidenceFill = document.getElementById('confidenceFill');
    const confidencePercent = document.getElementById('confidencePercent');
    const candidateList = document.getElementById('candidateList');

    // ----- state -----
    let stream = null;
    let isRunning = false;
    let animationFrame = null;
    let inferenceInterval = null;

    // ----- alphabet & mapping -----
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    // word mapping (ASL gloss)
    const wordMap = {
      'A': 'Apple', 'B': 'Ball', 'C': 'Cat', 'D': 'Dog', 'E': 'Eagle',
      'F': 'Fish', 'G': 'Golf', 'H': 'Hat', 'I': 'Ice', 'J': 'Jump',
      'K': 'Kite', 'L': 'Lion', 'M': 'Moon', 'N': 'Night', 'O': 'Ocean',
      'P': 'Panda', 'Q': 'Queen', 'R': 'Rain', 'S': 'Sun', 'T': 'Tree',
      'U': 'Umbrella', 'V': 'Violin', 'W': 'Water', 'X': 'X-ray', 'Y': 'Yoga',
      'Z': 'Zebra'
    };

    // ----- helper: generate random sign (simulated inference) -----
    function generatePrediction() {
      // pick a random letter (bias toward some letters for variety)
      const idx = Math.floor(Math.random() * alphabet.length);
      const letter = alphabet[idx];
      const confidence = 0.65 + (Math.random() * 0.34); // 65% – 99%
      return { letter, confidence };
    }

    // ----- update UI with prediction -----
    function updateUI(pred) {
      const letter = pred.letter;
      const conf = pred.confidence;
      const word = wordMap[letter] || letter;

      // main sign
      signChar.textContent = letter;
      signWord.textContent = word;

      // confidence
      const percent = Math.round(conf * 100);
      confidenceFill.style.width = `${percent}%`;
      confidencePercent.textContent = `${percent}%`;

      // top candidates (simulate 3)
      const candidates = generateTopCandidates(letter, conf);
      candidateList.innerHTML = candidates.map(c => `
        <div class="candidate-item">
          <span class="candidate-letter">${c.letter}</span>
          <span class="candidate-score">${Math.round(c.conf * 100)}%</span>
        </div>
      `).join('');
    }

    // ----- generate top 3 candidates (plausible) -----
    function generateTopCandidates(mainLetter, mainConf) {
      const list = [];
      // main
      list.push({ letter: mainLetter, conf: mainConf });

      // two random others with lower confidence
      const others = alphabet.filter(l => l !== mainLetter);
      for (let i = 0; i < 2; i++) {
        const randIdx = Math.floor(Math.random() * others.length);
        const letter = others.splice(randIdx, 1)[0];
        const conf = Math.max(0.01, mainConf - 0.2 - Math.random() * 0.3);
        list.push({ letter, conf });
      }
      // sort by confidence desc
      list.sort((a, b) => b.conf - a.conf);
      return list;
    }

    // ----- simulate inference loop (called every ~300ms) -----
    function runInference() {
      if (!isRunning) return;
      const pred = generatePrediction();
      updateUI(pred);
    }

    // ----- start camera + inference -----
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        await video.play();
        placeholder.style.display = 'none';
        isRunning = true;

        // start inference interval
        if (inferenceInterval) clearInterval(inferenceInterval);
        inferenceInterval = setInterval(runInference, 280);

        // UI
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (err) {
        console.warn('Camera error:', err);
        alert('Could not access camera. Please allow camera access and reload.');
        placeholder.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#ffab40;"></i> Camera unavailable`;
      }
    }

    // ----- stop camera and inference -----
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      isRunning = false;
      if (inferenceInterval) {
        clearInterval(inferenceInterval);
        inferenceInterval = null;
      }
      placeholder.style.display = 'flex';
      placeholder.innerHTML = `<i class="fas fa-camera"></i><span>Camera stopped</span>`;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    // ----- reset UI (no prediction) -----
    function resetUI() {
      signChar.textContent = '?';
      signWord.textContent = 'waiting';
      confidenceFill.style.width = '0%';
      confidencePercent.textContent = '0%';
      candidateList.innerHTML = `
        <div class="candidate-item"><span class="candidate-letter">—</span> <span class="candidate-score">—</span></div>
        <div class="candidate-item"><span class="candidate-letter">—</span> <span class="candidate-score">—</span></div>
        <div class="candidate-item"><span class="candidate-letter">—</span> <span class="candidate-score">—</span></div>
      `;
    }

    // ----- event listeners -----
    startBtn.addEventListener('click', startCamera);

    stopBtn.addEventListener('click', function() {
      stopCamera();
      resetUI();
    });

    resetBtn.addEventListener('click', function() {
      if (isRunning) {
        // if running, reset only UI, keep inference running
        resetUI();
      } else {
        resetUI();
      }
    });

    // initial reset
    resetUI();

    // if user leaves page, stop camera
    window.addEventListener('beforeunload', function() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      if (inferenceInterval) clearInterval(inferenceInterval);
    });

    // extra: if stop is clicked while running, stop everything
    // we already handle that.

    console.log('Real‑time Sign Language Recognition · ML simulation ready');
  })();
</script>

</body></html>
