<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Enquiry · Chatbot</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f6fe 0%, #dae7f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 48px;
            padding: 2rem 2.4rem;
            box-shadow: 0 30px 60px -16px rgba(0, 30, 50, 0.30),
                        0 0 0 1px rgba(255, 255, 255, 0.4) inset;
            transition: 0.2s;
        }

        @media (max-width: 580px) {
            .card {
                padding: 1.6rem 1rem;
                border-radius: 32px;
            }
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid rgba(0, 40, 70, 0.05);
        }

        .header i {
            font-size: 2.2rem;
            background: #1a4b6e;
            color: white;
            padding: 0.5rem 0.7rem;
            border-radius: 20px;
            box-shadow: 0 8px 16px -6px #1a4b6e80;
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            color: #082433;
        }

        .header .badge {
            margin-left: auto;
            background: #10445f;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            background: #1b5f81;
            box-shadow: 0 4px 10px rgba(0,40,60,0.2);
        }

        .sub {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e4f6b;
            font-weight: 450;
            margin-top: -0.4rem;
            margin-bottom: 1.6rem;
            font-size: 0.95rem;
        }

        .sub i {
            color: #2b6d90;
        }

        /* chat container */
        .chat-window {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 1.2rem 1.2rem 0.5rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 1.2rem;
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            scroll-behavior: smooth;
        }

        .chat-window::-webkit-scrollbar {
            width: 6px;
        }
        .chat-window::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
            border-radius: 12px;
        }
        .chat-window::-webkit-scrollbar-thumb {
            background: #a0bfd4;
            border-radius: 12px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 88%;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0.3; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .message-bot {
            align-self: flex-start;
        }

        .message-user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar-bot {
            background: #1f5f81;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0,40,60,0.08);
        }

        .avatar-user {
            background: #225a7a;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0,40,60,0.08);
        }

        .bubble {
            background: white;
            padding: 0.7rem 1.2rem;
            border-radius: 22px;
            border-top-left-radius: 6px;
            box-shadow: 0 4px 12px rgba(0, 20, 30, 0.04);
            font-size: 0.95rem;
            line-height: 1.5;
            color: #082433;
            word-break: break-word;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .message-user .bubble {
            background: #1d5779;
            color: white;
            border-top-right-radius: 6px;
            border-top-left-radius: 22px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .time-tag {
            font-size: 0.65rem;
            opacity: 0.6;
            margin-top: 4px;
            padding-left: 4px;
        }

        /* input area */
        .input-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 0.3rem 0.3rem 0.3rem 1.6rem;
            border: 1px solid rgba(255,255,255,0.5);
            margin-top: 0.4rem;
        }

        .input-bar input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.9rem 0.2rem;
            font-size: 0.95rem;
            outline: none;
            color: #0b2c40;
            min-width: 0;
        }

        .input-bar input::placeholder {
            color: #6b8ea8;
            font-weight: 400;
        }

        .input-bar button {
            background: #1a5777;
            border: none;
            color: white;
            padding: 0.7rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 16px -6px #1a4b6e70;
            font-size: 0.9rem;
        }

        .input-bar button:hover {
            background: #0f405a;
            transform: scale(1.02);
        }

        .input-bar button:active {
            transform: scale(0.95);
        }

        .input-bar button i {
            font-size: 1rem;
        }

        .quick-reply {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.8rem 0 0.2rem 0;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(30, 80, 110, 0.15);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1b4b66;
            cursor: pointer;
            transition: 0.1s;
        }

        .quick-btn:hover {
            background: white;
            border-color: #1f688b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
        }

        .footer-note {
            font-size: 0.7rem;
            color: #3a6b86;
            margin-top: 0.8rem;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            border-top: 1px solid rgba(0,0,0,0.03);
            padding-top: 0.8rem;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <i class="fas fa-comment-dots"></i>
        <h1>College Enquiry</h1>
        <span class="badge"><i class="fas fa-robot" style="margin-right: 4px;"></i> AI · 24/7</span>
    </div>
    <div class="sub">
        <i class="fas fa-graduation-cap"></i>
        <span>Ask about admissions, courses, fees, campus — we're here to help.</span>
    </div>

    <!-- chat messages -->
    <div class="chat-window" id="chatWindow">
        <!-- messages will be injected here -->
        <div class="message message-bot">
            <div class="avatar-bot"><i class="fas fa-robot"></i></div>
            <div>
                <div class="bubble">Hello! 👋 I'm the College Enquiry bot. Ask me anything about admissions, courses, scholarships, or campus life.</div>
                <div class="time-tag">just now</div>
            </div>
        </div>
    </div>

    <!-- quick replies -->
    <div class="quick-reply" id="quickReplyContainer">
        <button class="quick-btn" data-quick="admissions">📋 Admissions</button>
        <button class="quick-btn" data-quick="courses">📚 Courses</button>
        <button class="quick-btn" data-quick="fees">💰 Fees & aid</button>
        <button class="quick-btn" data-quick="campus">🏛️ Campus</button>
    </div>

    <!-- input bar -->
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Type your question..." autofocus>
        <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
    </div>

    <div class="footer-note">
        <span><i class="fas fa-database"></i> 50+ FAQs</span>
        <span><i class="fas fa-shield-alt"></i> secure</span>
        <span><i class="fas fa-clock"></i> instant reply</span>
    </div>
</div>

<script>
    (function() {
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const quickBtns = document.querySelectorAll('.quick-btn');

        // ----- knowledge base (simple rule-based) -----
        const faq = {
            'admissions': {
                keywords: ['admission', 'apply', 'application', 'deadline', 'eligibility', 'entrance', 'form', 'dates'],
                response: "📋 **Admissions 2026**\n• Applications open: **May 1 – July 31**\n• Eligibility: 10+2 with 60% (minimum)\n• Entrance exam: College Aptitude Test (CAT) – August 15\n• Apply online at our portal. Need help with the form? Just ask!"
            },
            'courses': {
                keywords: ['course', 'program', 'major', 'bachelor', 'master', 'degree', 'bsc', 'ba', 'bcom', 'mba', 'engineering'],
                response: "📚 **Courses offered**\n• B.Sc. (CS, Math, Physics)  \n• B.A. (Economics, English, History)\n• B.Com (Hons)\n• MBA (2-year)\n• M.Sc. (Data Science, Chemistry)\n• Certificate courses in AI & Digital Marketing.\nCheck the full list on our website."
            },
            'fees': {
                keywords: ['fee', 'fees', 'tuition', 'scholarship', 'aid', 'financial', 'cost', 'payment', 'installment'],
                response: "💰 **Fee structure (2026-27)**\n• Tuition: ₹1,20,000/year (UG) | ₹1,80,000/year (PG)\n• Hostel: ₹60,000/year (incl. mess)\n• **Scholarships**: merit-based (up to 100% tuition), need-based, sports quota.\n• Installment options available. Contact finance office for details."
            },
            'campus': {
                keywords: ['campus', 'hostel', 'library', 'facility', 'lab', 'sports', 'location', 'infrastructure', 'canteen'],
                response: "🏛️ **Campus life**\n• 50-acre green campus, fully Wi-Fi.\n• Hostels: separate for boys/girls, AC & non-AC.\n• Library: 24/7, digital resources.\n• Sports: cricket, football, basketball, gym.\n• Cafeteria, medical center, and transport.\nVirtual tour available on request."
            },
            'default': {
                response: "That's a great question! 😊 I can help with admissions, courses, fees, campus, and more. Could you be more specific? (or try one of the quick buttons above)"
            }
        };

        // helper: get response based on input
        function getBotResponse(text) {
            const lower = text.toLowerCase();
            // check each category
            for (const key of ['admissions', 'courses', 'fees', 'campus']) {
                const entry = faq[key];
                for (const word of entry.keywords) {
                    if (lower.includes(word)) {
                        return entry.response;
                    }
                }
            }
            // if no match, return default
            return faq['default'].response;
        }

        // helper: add message to chat
        function addMessage(sender, text, isBot = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isBot ? 'message-bot' : 'message-user'}`;

            const avatarDiv = document.createElement('div');
            avatarDiv.className = isBot ? 'avatar-bot' : 'avatar-user';
            avatarDiv.innerHTML = isBot ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';

            const bubbleWrapper = document.createElement('div');
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            // support markdown-like bold
            bubbleDiv.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            const timeTag = document.createElement('div');
            timeTag.className = 'time-tag';
            const now = new Date();
            timeTag.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            bubbleWrapper.appendChild(bubbleDiv);
            bubbleWrapper.appendChild(timeTag);
            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(bubbleWrapper);

            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // send user message and get bot reply
        function handleSend() {
            const text = userInput.value.trim();
            if (text === '') return;

            // add user message
            addMessage('user', text, false);
            userInput.value = '';
            userInput.focus();

            // get bot response (simulate delay)
            const response = getBotResponse(text);
            setTimeout(() => {
                addMessage('bot', response, true);
            }, 300 + Math.random() * 200);
        }

        // quick reply handler
        function handleQuick(query) {
            let mapped = '';
            if (query === 'admissions') mapped = 'tell me about admissions';
            else if (query === 'courses') mapped = 'courses offered';
            else if (query === 'fees') mapped = 'fees and scholarships';
            else if (query === 'campus') mapped = 'campus facilities';
            else return;

            // simulate user typing quick reply
            const displayText = mapped.charAt(0).toUpperCase() + mapped.slice(1);
            addMessage('user', displayText, false);
            // bot reply
            const response = getBotResponse(mapped);
            setTimeout(() => {
                addMessage('bot', response, true);
            }, 200 + Math.random() * 200);
        }

        // ---- event listeners ----
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        });

        quickBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const query = this.dataset.quick;
                handleQuick(query);
            });
        });

        // optional: initial focus
        userInput.focus();

        // extra: make sure chat window shows initial message (already in HTML)
        // but we keep it
    })();
</script>

</body>
</html>
